name: Challenge checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: auto-equity-ci-${{ github.run_id }}-${{ github.run_attempt }}
      EVAL_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate isolated demo configuration (no external accounts)
        run: python3 scripts/bootstrap_env.py
      - name: Build pinned dependencies and customer UI
        run: docker compose build api minio agent chat-ui
      - name: Start disposable stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify backend, agent, UI and deterministic scenarios
        run: python3 scripts/verify_ci.py
      - name: Remove only this disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
